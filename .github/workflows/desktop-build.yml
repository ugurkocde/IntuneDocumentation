name: Desktop installers

on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "src/lib/**"
      - "src/types/**"
      - "public/logo.png"
      - ".github/workflows/desktop-build.yml"
  push:
    tags:
      - "desktop-v*"
  # Manual runs can produce signed test builds that point at a test licensing
  # server and update feed, optionally with a different version number.
  workflow_dispatch:
    inputs:
      license_api_base:
        description: "Licensing service for a test build (default http://127.0.0.1:3000)"
        required: false
      license_public_key:
        description: "Token public key PEM for a test build (\\n for newlines)"
        required: false
      update_url:
        description: "Update feed for a test build (default: production feed)"
        required: false
      version:
        description: "Version override for a test build, for example 0.1.1"
        required: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
          - os: macos-latest
            script: dist:mac
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check tag matches the app version
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "desktop-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

      # Release builds embed the production licensing service and token key.
      # Other builds point at a local licensing server so test installs never
      # create activations on real customer keys.
      - name: Select licensing configuration
        shell: bash
        env:
          RELEASE_PUBLIC_KEY: ${{ secrets.INTUNEDOC_LICENSE_PUBLIC_KEY }}
          RELEASE_PORTAL_URL: ${{ vars.INTUNEDOC_LICENSE_PORTAL_URL }}
          TEST_API_BASE: ${{ inputs.license_api_base }}
          TEST_PUBLIC_KEY: ${{ inputs.license_public_key }}
          TEST_UPDATE_URL: ${{ inputs.update_url }}
          TEST_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/desktop-v* ]]; then
            if [ -z "$RELEASE_PUBLIC_KEY" ] || [ -z "$RELEASE_PORTAL_URL" ]; then
              echo "Release builds need the INTUNEDOC_LICENSE_PUBLIC_KEY secret and INTUNEDOC_LICENSE_PORTAL_URL variable" >&2
              exit 1
            fi
            {
              echo "INTUNEDOC_LICENSE_API_BASE=https://intunedocumentation.com"
              echo "INTUNEDOC_LICENSE_BUY_URL=https://intunedocumentation.com/desktop#pricing"
              echo "INTUNEDOC_LICENSE_PORTAL_URL=$RELEASE_PORTAL_URL"
              echo "INTUNEDOC_LICENSE_PUBLIC_KEY<<PEM"
              printf '%s\n' "$RELEASE_PUBLIC_KEY"
              echo "PEM"
            } >> "$GITHUB_ENV"
          else
            echo "INTUNEDOC_LICENSE_API_BASE=${TEST_API_BASE:-http://127.0.0.1:3000}" >> "$GITHUB_ENV"
            if [ -n "$TEST_PUBLIC_KEY" ]; then
              echo "INTUNEDOC_LICENSE_PUBLIC_KEY=$TEST_PUBLIC_KEY" >> "$GITHUB_ENV"
            fi
            if [ -n "$TEST_UPDATE_URL" ]; then
              echo "INTUNEDOC_UPDATE_URL=$TEST_UPDATE_URL" >> "$GITHUB_ENV"
            fi
            if [ -n "$TEST_VERSION" ]; then
              if ! [[ "$TEST_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                echo "Version override must look like 1.2.3" >&2
                exit 1
              fi
              echo "BUILDER_ARGS=-c.extraMetadata.version=$TEST_VERSION" >> "$GITHUB_ENV"
            fi
          fi

      - name: Import macOS signing certificate
        if: runner.os == 'macOS'
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          if [ -n "$MAC_CERT_P12_BASE64" ]; then
            printf '%s' "$MAC_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
            KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            security set-keychain-settings -lut 21600 "$KEYCHAIN"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
            security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          fi

      - name: Prepare Apple API key
        if: runner.os == 'macOS'
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
        run: |
          if [ -n "$APPLE_API_KEY_CONTENT" ]; then
            printf '%s' "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/AuthKey.p8"
            echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          fi

      - name: Build installer
        shell: bash
        run: npm run ${{ matrix.script }} -- $BUILDER_ARGS
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "true"
          CSC_FOR_PULL_REQUEST: "true"
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_PUBLISHER_NAME: ${{ secrets.AZURE_PUBLISHER_NAME }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_CERT_PROFILE_NAME: ${{ secrets.AZURE_CERT_PROFILE_NAME }}
          AZURE_CODE_SIGNING_ACCOUNT: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT }}

      - name: Notarize and staple DMG
        if: runner.os == 'macOS'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -f "$APPLE_API_KEY" ]; then
            for dmg in release/*.dmg; do
              [ -e "$dmg" ] || continue
              xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait
              xcrun stapler staple "$dmg"
            done
          fi

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: intune-documentation-${{ matrix.os }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.exe.blockmap
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.zip.blockmap
            apps/desktop/release/latest*.yml
          if-no-files-found: error

  # Tag builds publish one GitHub release with the installers and the update
  # metadata. electron-updater reads it through the site's update feed.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          test -f dist/latest.yml
          test -f dist/latest-mac.yml
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Intune Documentation desktop ${GITHUB_REF_NAME#desktop-v}" \
            --notes "Desktop app ${GITHUB_REF_NAME#desktop-v}. Existing installations update automatically." \
            --latest=false
