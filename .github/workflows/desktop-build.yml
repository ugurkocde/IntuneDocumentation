name: Desktop installers

on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "src/lib/**"
      - "src/types/**"
      - "public/logo.png"
      - ".github/workflows/desktop-build.yml"
  push:
    tags:
      - "desktop-v*"
  # Manual runs can produce signed test builds that point at a test licensing
  # server and update feed, optionally with a different version number.
  workflow_dispatch:
    inputs:
      license_api_base:
        description: "Licensing service for a test build (default http://127.0.0.1:3000)"
        required: false
      license_public_key:
        description: "Token public key PEM for a test build (\\n for newlines)"
        required: false
      update_url:
        description: "Update feed for a test build (default: production feed)"
        required: false
      version:
        description: "Version override for a test build, for example 0.1.1"
        required: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
          - os: macos-latest
            script: dist:mac
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check tag matches the app version
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "desktop-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

      # electron-builder silently skips signing when credentials are missing, so
      # a release must prove it has them before building.
      - name: Require signing credentials for release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_CERT_PROFILE_NAME: ${{ secrets.AZURE_CERT_PROFILE_NAME }}
          AZURE_CODE_SIGNING_ACCOUNT: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT }}
        run: |
          missing=()
          if [ "$RUNNER_OS" = "Windows" ]; then
            for name in AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_TRUSTED_SIGNING_ENDPOINT AZURE_CERT_PROFILE_NAME AZURE_CODE_SIGNING_ACCOUNT; do
              [ -n "${!name}" ] || missing+=("$name")
            done
          else
            for name in MAC_CERT_P12_BASE64 MAC_CERT_PASSWORD; do
              [ -n "${!name}" ] || missing+=("$name")
            done
            if ! { [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; } &&
              ! { [ -n "$APPLE_API_KEY_CONTENT" ] && [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_ISSUER" ]; }; then
              missing+=("APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID, or APPLE_API_KEY, APPLE_API_KEY_ID and APPLE_API_ISSUER")
            fi
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Release builds must be signed. Missing secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      # Release builds embed the production licensing service and token key.
      # Other builds point at a local licensing server so test installs never
      # create activations on real customer keys.
      - name: Select licensing configuration
        shell: bash
        env:
          RELEASE_PUBLIC_KEY: ${{ secrets.INTUNEDOC_LICENSE_PUBLIC_KEY }}
          RELEASE_PORTAL_URL: ${{ vars.INTUNEDOC_LICENSE_PORTAL_URL }}
          TEST_API_BASE: ${{ inputs.license_api_base }}
          TEST_PUBLIC_KEY: ${{ inputs.license_public_key }}
          TEST_UPDATE_URL: ${{ inputs.update_url }}
          TEST_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/desktop-v* ]]; then
            if [ -z "$RELEASE_PUBLIC_KEY" ] || [ -z "$RELEASE_PORTAL_URL" ]; then
              echo "Release builds need the INTUNEDOC_LICENSE_PUBLIC_KEY secret and INTUNEDOC_LICENSE_PORTAL_URL variable" >&2
              exit 1
            fi
            {
              echo "INTUNEDOC_LICENSE_API_BASE=https://intunedocumentation.com"
              echo "INTUNEDOC_LICENSE_BUY_URL=https://intunedocumentation.com/desktop#pricing"
              echo "INTUNEDOC_LICENSE_PORTAL_URL=$RELEASE_PORTAL_URL"
              delimiter="EOF_$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
              echo "INTUNEDOC_LICENSE_PUBLIC_KEY<<$delimiter"
              printf '%s\n' "$RELEASE_PUBLIC_KEY"
              echo "$delimiter"
            } >> "$GITHUB_ENV"
          else
            # Dispatch inputs are free text, and the REST API accepts newlines,
            # so a raw value could add lines to GITHUB_ENV (BASH_ENV, for
            # example) that later secret-holding steps would load. Allow only
            # plain URL and PEM characters, and write through heredocs with a
            # random delimiter.
            url_pattern='^https?://[A-Za-z0-9.-]+(:[0-9]{1,5})?(/[A-Za-z0-9._~%/-]*)?$'
            api_base="${TEST_API_BASE:-http://127.0.0.1:3000}"
            if ! [[ "$api_base" =~ $url_pattern ]]; then
              echo "license_api_base must be a plain http(s) URL" >&2
              exit 1
            fi
            if [ -n "$TEST_UPDATE_URL" ] && ! [[ "$TEST_UPDATE_URL" =~ $url_pattern ]]; then
              echo "update_url must be a plain http(s) URL" >&2
              exit 1
            fi
            # A PEM with \n escapes for newlines; esbuild.config.mjs expands
            # them and rejects anything that is not an Ed25519 public key.
            if [ -n "$TEST_PUBLIC_KEY" ] && ! [[ "$TEST_PUBLIC_KEY" =~ ^-----BEGIN\ PUBLIC\ KEY-----[A-Za-z0-9+/=\\]+-----END\ PUBLIC\ KEY-----(\\n)?$ ]]; then
              echo "license_public_key must be a PEM public key on one line with \\n for newlines" >&2
              exit 1
            fi
            write_env() {
              local delimiter
              delimiter="EOF_$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
              printf '%s<<%s\n%s\n%s\n' "$1" "$delimiter" "$2" "$delimiter" >> "$GITHUB_ENV"
            }
            write_env INTUNEDOC_LICENSE_API_BASE "$api_base"
            if [ -n "$TEST_PUBLIC_KEY" ]; then
              write_env INTUNEDOC_LICENSE_PUBLIC_KEY "$TEST_PUBLIC_KEY"
            fi
            if [ -n "$TEST_UPDATE_URL" ]; then
              write_env INTUNEDOC_UPDATE_URL "$TEST_UPDATE_URL"
            fi
            if [ -n "$TEST_VERSION" ]; then
              if ! [[ "$TEST_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                echo "Version override must look like 1.2.3" >&2
                exit 1
              fi
              echo "BUILDER_ARGS=-c.extraMetadata.version=$TEST_VERSION" >> "$GITHUB_ENV"
            fi
          fi

      # Pull request builds stay unsigned so branch code never runs next to the
      # signing identities. Manual and tag builds are signed.
      - name: Import macOS signing certificate
        if: runner.os == 'macOS' && github.event_name != 'pull_request'
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          if [ -n "$MAC_CERT_P12_BASE64" ]; then
            printf '%s' "$MAC_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
            KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            security set-keychain-settings -lut 21600 "$KEYCHAIN"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
            security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          fi

      - name: Prepare Apple API key
        if: runner.os == 'macOS' && github.event_name != 'pull_request'
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
        run: |
          if [ -n "$APPLE_API_KEY_CONTENT" ]; then
            printf '%s' "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/AuthKey.p8"
            echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          fi

      - name: Build installer
        if: github.event_name == 'pull_request'
        shell: bash
        run: npm run ${{ matrix.script }} -- $BUILDER_ARGS
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Build and sign installer
        if: github.event_name != 'pull_request'
        shell: bash
        run: npm run ${{ matrix.script }} -- $BUILDER_ARGS
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "true"
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_PUBLISHER_NAME: ${{ secrets.AZURE_PUBLISHER_NAME }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_CERT_PROFILE_NAME: ${{ secrets.AZURE_CERT_PROFILE_NAME }}
          AZURE_CODE_SIGNING_ACCOUNT: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT }}

      - name: Verify Windows signature
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/desktop-v')
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem release -Filter *.exe -File)
          if ($installers.Count -eq 0) { throw "No installers found to verify" }
          foreach ($file in $installers) {
            $signature = Get-AuthenticodeSignature -FilePath $file.FullName
            if ($signature.Status -ne 'Valid') {
              throw "$($file.Name) signature status is $($signature.Status): $($signature.StatusMessage)"
            }
            Write-Host "$($file.Name) signed by $($signature.SignerCertificate.Subject)"
          }

      - name: Verify macOS signature
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/desktop-v')
        run: |
          shopt -s nullglob
          apps=(release/mac*/*.app)
          if [ "${#apps[@]}" -eq 0 ]; then
            echo "No app bundles found to verify" >&2
            exit 1
          fi
          for app in "${apps[@]}"; do
            codesign --verify --deep --strict --verbose=2 "$app"
            details="$(codesign -dvv "$app" 2>&1)"
            if ! grep -q '^Authority=Developer ID Application:' <<< "$details"; then
              echo "$app is not signed with a Developer ID Application certificate" >&2
              exit 1
            fi
          done

      - name: Notarize and staple DMG
        if: runner.os == 'macOS' && github.event_name != 'pull_request'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -f "$APPLE_API_KEY" ]; then
            for dmg in release/*.dmg; do
              [ -e "$dmg" ] || continue
              xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait
              xcrun stapler staple "$dmg"
            done
          fi

      - name: Upload installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: intune-documentation-${{ matrix.os }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.exe.blockmap
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.zip.blockmap
            apps/desktop/release/latest*.yml
          if-no-files-found: error

  # Tag builds publish one GitHub release with the installers and the update
  # metadata. electron-updater reads it through the site's update feed.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          test -f dist/latest.yml
          test -f dist/latest-mac.yml
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Intune Documentation desktop ${GITHUB_REF_NAME#desktop-v}" \
            --notes "Desktop app ${GITHUB_REF_NAME#desktop-v}. Existing installations update automatically." \
            --latest=false
