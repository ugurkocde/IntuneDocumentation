<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Intune Documentation</title>
    <style>
      :root {
        color-scheme: light dark;
        --brand: #0f766e;
        --line: rgba(127, 127, 127, 0.28);
      }
      * {
        box-sizing: border-box;
      }
      body {
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        margin: 0;
        padding: 28px;
        line-height: 1.45;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 4px;
      }
      h2 {
        font-size: 15px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        opacity: 0.7;
        margin: 0 0 12px;
      }
      .sub {
        margin: 0 0 22px;
        opacity: 0.7;
        font-size: 14px;
      }
      .card {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 18px;
        margin-bottom: 18px;
      }
      label {
        display: block;
        font-size: 13px;
        margin-bottom: 10px;
      }
      input {
        display: block;
        width: 100%;
        margin-top: 4px;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        font: inherit;
      }
      button {
        padding: 9px 14px;
        margin: 0 8px 8px 0;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: transparent;
        font: inherit;
        cursor: pointer;
      }
      button.primary {
        background: var(--brand);
        border-color: var(--brand);
        color: white;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      #status {
        font-weight: 600;
      }
      #message {
        min-height: 20px;
        font-size: 14px;
      }
      #progress {
        font-size: 13px;
        opacity: 0.8;
      }
      pre {
        background: rgba(127, 127, 127, 0.1);
        border-radius: 8px;
        padding: 12px;
        max-height: 260px;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-word;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <h1>Intune Documentation</h1>
    <p class="sub">
      Document your own Intune tenant locally. Your configuration never leaves
      this device.
    </p>

    <section class="card">
      <h2>Your app registration</h2>
      <label>
        Client ID
        <input
          id="client-id"
          type="text"
          placeholder="Your Entra app registration client id"
          autocomplete="off"
          spellcheck="false"
        />
      </label>
      <label>
        Tenant ID
        <input
          id="tenant-id"
          type="text"
          placeholder="organizations or your tenant id"
          autocomplete="off"
          spellcheck="false"
        />
      </label>
      <button id="save-settings" class="primary">Save settings</button>
      <span id="settings-message"></span>
    </section>

    <section class="card">
      <h2>Documentation</h2>
      <p id="status">Checking sign-in status...</p>
      <div>
        <button id="sign-in-interactive">Sign in with browser</button>
        <button id="sign-out">Sign out</button>
        <button id="collect-all">Collect tenant data</button>
        <button id="export-docx">Export Word</button>
        <button id="export-pdf">Export PDF</button>
      </div>
      <p id="message"></p>
      <p id="progress"></p>
      <pre id="result" hidden></pre>
    </section>

    <script src="./renderer.js"></script>
  </body>
</html>
